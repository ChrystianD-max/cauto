# C-AUTO - RENDER BLUEPRINT (premier essai gratuit)
# Service web unique (nginx + node dans un conteneur) + PostgreSQL + Redis (Key Value).
# TLS gere par Render (https://cauto.onrender.com).

# La migration + seed sont executes au demarrage du web service (idempotents),
# donc aucune action manuelle requise apres le deploiement.

databases:
  - name: cauto-db
    plan: free
    databaseName: cauto
    user: cauto

services:
  # ----------------------- Backend + Frontend (un seul conteneur) ----------
  - type: web
    name: cauto
    runtime: docker
    repo: https://github.com/ChrystianD-max/cauto
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile.render
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: production
      - key: DEMO_MODE
        value: "true"
      - key: SEED_ADMIN_EMAIL
        value: admin.dev@cauto.local
      - key: SEED_ADMIN_NAME
        value: Admin Developpement
      - key: SEED_ADMIN_PASSWORD
        value: Dev#Admin#85
      - key: SEED_ADMIN_PHONE
        value: +22997000000
      - key: APP_PUBLIC_URL
        value: https://cauto.onrender.com
      - key: CORS_ORIGINS
        value: https://cauto.onrender.com
      - key: TRUST_PROXY
        value: "1"
      - key: COOKIE_SAME_SITE
        value: lax
      - key: UPLOAD_DIR
        value: /app/data/uploads
      - key: METRICS_TOKEN
        value: demo-metrics-token-rotate-me
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: cauto-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: cauto-redis
          property: connectionString

  # ----------------------- Cache Redis / Key Value (plan free) ---------------
  - type: keyvalue
    name: cauto-redis
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []