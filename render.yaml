# C-AUTO - RENDER BLUEPRINT
# Service web unique (nginx + node dans un conteneur) + PostgreSQL.
# TLS gere par Render (https://cauto.onrender.com).
#
# La migration + seed sont executes au demarrage du web service (idempotents),
# donc aucune action manuelle requise apres le deploiement.
#
# NOTE : Redis n'est plus declare. Redis est une dependance OPTIONNELLE
# (le backend degrade proprement : rate limiter en memoire, Socket.io en
# mono-instance, health check 200). Si un Redis est ajoute, declarer ici une
# ressource `type: keyvalue` et relancer REDIS_URL via fromService.

databases:
  - name: cauto-db
    plan: free
    databaseName: cauto
    user: cauto

services:
  # ----------------------- Backend + Frontend (un seul conteneur) ----------
  - type: web
    name: cauto
    runtime: docker
    repo: https://github.com/ChrystianD-max/cauto
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile.render
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: production
      - key: DEMO_MODE
        value: "false"
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_NAME
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_ADMIN_PHONE
        sync: false
      # Compte SUPER_ADMIN de production : mot de passe dedie, >= 12 caracteres.
      # La migration v11 duplique le hash de l'admin principal : sans ces
      # variables, aucun SUPER_ADMIN n'est cree et le compte historique est
      # suspendu (comptes de demonstration).
      - key: SEED_SUPER_ADMIN_EMAIL
        sync: false
      - key: SEED_SUPER_ADMIN_NAME
        sync: false
      - key: SEED_SUPER_ADMIN_PASSWORD
        sync: false
      - key: SEED_SUPER_ADMIN_PHONE
        sync: false
      # Web Push (VAPID) : la cle privee ne quitte jamais l'environnement.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: APP_PUBLIC_URL
        value: https://cauto.onrender.com
      - key: CORS_ORIGINS
        value: https://cauto.onrender.com
      - key: TRUST_PROXY
        value: "1"
      - key: COOKIE_SAME_SITE
        value: lax
      - key: UPLOAD_DIR
        value: /app/data/uploads
      - key: METRICS_TOKEN
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: cauto-db
          property: connectionString
