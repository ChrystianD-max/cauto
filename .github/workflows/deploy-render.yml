name: Deploy to Render

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Trigger Render Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy Hook
        if: ${{ secrets.RENDER_DEPLOY_HOOK != '' }}
        run: |
          echo "🚀 Triggering Render deploy..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}")
          echo "HTTP response: $HTTP_CODE"
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✅ Deploy triggered successfully"
          else
            echo "⚠️ Deploy hook returned HTTP $HTTP_CODE - secret URL may be invalid/expired"
            echo "Go to Render Dashboard > Web Service > Settings > Deploy Hook to regenerate"
          fi
      - name: Skip (no deploy hook configured)
        if: ${{ secrets.RENDER_DEPLOY_HOOK == '' }}
        run: |
          echo "⚠️ RENDER_DEPLOY_HOOK secret not set."
          echo "1. Go to Render Dashboard > Your Web Service > Settings > Deploy Hook"
          echo "2. Copy the Deploy Hook URL"
          echo "3. Go to GitHub Repo > Settings > Secrets and variables > Actions > New repository secret"
          echo "4. Name: RENDER_DEPLOY_HOOK"
          echo "5. Paste the URL as value"
          echo "6. Next push will auto-deploy!"
