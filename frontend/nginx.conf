server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json text/xml image/svg+xml font/woff2;

    location /api/ {
        proxy_pass http://backend:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Documents (HTML) de l'application : toujours frais (SPA, versions ?v= sur les assets)
    location /app/ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ /app/index.html;
    }
    # PWA : le service worker (et son registre) ne doivent JAMAIS être mis en cache
    # longue durée (le navigateur doit pouvoir détecter les mises à jour).
    location ~* ^/app/(sw\.js|pwa\.js|manifest\.json)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }
    # Assets de l'application : immuables (fichiers versionnés ?v=)
    location ~* ^/app/.*\.(js|css|woff2?|ttf|otf|svg|png|jpe?g|gif|webp|ico|webmanifest)$ {
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    # Pages marketing statiques : fraîches
    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
    # Assets marketing : cache 7 jours
    location ~* \.(js|css|woff2?|ttf|otf|svg|png|jpe?g|gif|webp|ico)$ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }
}